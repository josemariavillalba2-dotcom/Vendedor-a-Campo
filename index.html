         <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading);font-size:24px;line-height:1\">{{ k.valor }}<\u002Fdiv>\n              <div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700);margin-top:4px\">{{ k.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hayAltas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px\">\n              <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Altas para revisar<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ altasResumen }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"cols\">\n              <sc-for list=\"{{ altasPendientes }}\" as=\"a\" hint-placeholder-count=\"2\">\n                <div class=\"blueprint\" style=\"padding:12px 13px;background:var(--color-accent-100);border-color:var(--color-accent-400)\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\">\n                    <div style=\"font-family:var(--font-heading);font-size:15.5px;text-transform:uppercase;line-height:1.15\">{{ a.titulo }}<\u002Fdiv>\n                    <span class=\"tag tag-outline\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ a.tipoLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:3px\">{{ a.meta }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:3px;margin-top:8px\">\n                    <sc-for list=\"{{ a.campos }}\" as=\"c\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;gap:8px;font-size:12.5px\">\n                        <span style=\"flex:0 0 108px;color:var(--color-neutral-600)\">{{ c.k }}<\u002Fspan>\n                        <span style=\"flex:1\">{{ c.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;margin-top:11px;flex-wrap:wrap\">\n                    <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ a.aprobar }}\" style=\"flex:1;min-width:120px;justify-content:center;min-height:44px\">Aprobar<\u002Fbutton>\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ a.rechazar }}\" style=\"flex:1;min-width:120px;justify-content:center;min-height:44px\">Rechazar<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px\">\n          <sc-for list=\"{{ equipoChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onPick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px\">\n          <sc-for list=\"{{ vendedorChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onPick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <sc-for list=\"{{ bandeja }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <div class=\"blueprint\" style=\"padding:13px 14px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\">\n                <div style=\"font-family:var(--font-heading);font-size:16px;text-transform:uppercase;line-height:1.15\">{{ v.cliente }}<\u002Fdiv>\n                <span class=\"{{ v.estadoCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ v.estadoLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:3px\">{{ v.meta }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;margin-top:6px;line-height:1.45\">{{ v.resumen }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:5px;line-height:1.4\">{{ v.proximoTexto }}<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:11px;flex-wrap:wrap\">\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ v.aprobar }}\" style=\"flex:1;min-width:120px;justify-content:center;min-height:44px\">Aprobar<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ v.observar }}\" style=\"flex:1;min-width:120px;justify-content:center;min-height:44px\">Devolver<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--color-accent-800);margin-top:7px;line-height:1.4\">{{ v.devolucion }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ bandejaVacia }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px dashed var(--color-neutral-400);padding:26px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Nada para revisar con estos filtros.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ TABLERO — gerente ══ -->\n    <sc-if value=\"{{ esTablero }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap\">\n          <div>\n            <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ hoyTexto }}<\u002Fdiv>\n            <h4 style=\"text-transform:uppercase;margin:4px 0 0\">Tablero de posventa<\u002Fh4>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap;align-items:center\">\n            <sc-for list=\"{{ periodoChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.onPick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportarPeriodo }}\" style=\"min-height:40px;white-space:nowrap\">Bajar informe<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cols3\">\n          <sc-for list=\"{{ tableroKpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n            <div class=\"blueprint\" style=\"padding:12px 13px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:23px;line-height:1.05;margin-top:4px\">{{ k.valor }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700);margin-top:2px\">{{ k.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n              <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Actividad por vendedor<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ periodoTexto }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ ranking }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div class=\"blueprint\" style=\"padding:10px 12px\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\">\n                    <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase\">{{ r.nombre }}<\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading);font-size:15px\">{{ r.monto }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"height:10px;display:flex;border:1px solid var(--color-divider);margin-top:7px\">\n                    <div style=\"{{ r.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:5px\">{{ r.detalle }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sinRanking }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px dashed var(--color-neutral-400);padding:24px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Sin actividad en el período.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n              <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Resultados<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">visitas · monto<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ embudo }}\" as=\"e\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:center;gap:9px\">\n                  <div style=\"flex:0 0 116px;font-size:12px\">{{ e.label }}<\u002Fdiv>\n                  <div style=\"flex:1;height:12px;display:flex;border:1px solid var(--color-divider)\">\n                    <div style=\"{{ e.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 0 84px;text-align:right;font-size:11.5px;color:var(--color-neutral-700)\">{{ e.valor }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n                <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Temas más trabajados<\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--color-neutral-700)\">visitas<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"width:100%;font-size:12.5px\">\n                <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left\">Tema<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Visitas<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Monto<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ porTema }}\" as=\"t\" hint-placeholder-count=\"5\">\n                    <sc-raw-tr><sc-raw-td>{{ t.tema }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">{{ t.n }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">{{ t.monto }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n            <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Últimas visitas<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ ultimasResumen }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"scroll-x\">\n            <sc-raw-table class=\"table\" style=\"width:100%;min-width:720px;font-size:12.5px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left\">Fecha<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Cliente<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Vendedor<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Resultado<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Monto<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Estado<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ ultimas }}\" as=\"v\" hint-placeholder-count=\"8\">\n                  <sc-raw-tr>\n                    <sc-raw-td>{{ v.fecha }}<\u002Fsc-raw-td><sc-raw-td>{{ v.cliente }}<\u002Fsc-raw-td><sc-raw-td>{{ v.vendedor }}<\u002Fsc-raw-td>\n                    <sc-raw-td>{{ v.resultado }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">{{ v.monto }}<\u002Fsc-raw-td>\n                    <sc-raw-td><span class=\"{{ v.estadoCls }}\" style=\"font-size:10px\">{{ v.estadoLabel }}<\u002Fspan><\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ AJUSTES ══ -->\n    <sc-if value=\"{{ esAjustes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:640px;display:flex;flex-direction:column;gap:14px\">\n        <h4 style=\"text-transform:uppercase;letter-spacing:.04em;margin:0\">Ajustes<\u002Fh4>\n        <div class=\"blueprint\" style=\"padding:12px 13px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\">\n            <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">Planilla compartida<\u002Fdiv>\n            <span class=\"{{ syncTagCls }}\" style=\"font-size:10px;letter-spacing:.05em\">{{ syncTexto }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;margin-top:6px;line-height:1.45\">{{ syncDetalle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Tu nombre<\u002Flabel>\n          <input class=\"input\" type=\"text\" placeholder=\"Cómo firmás las visitas\" value=\"{{ miNombreEdit }}\" sc-camel-on-input=\"{{ setMiNombre }}\" style=\"height:46px\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>URL del Web App de Apps Script<\u002Flabel>\n          <input class=\"input\" type=\"url\" inputmode=\"url\" placeholder=\"https://script.google.com/macros/s/…/exec\" value=\"{{ apiUrlEdit }}\" sc-camel-on-input=\"{{ setApiUrl }}\" style=\"height:46px\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarAjustes }}\" style=\"flex:1;min-width:180px;justify-content:center;min-height:46px\">Guardar y sincronizar<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ refrescar }}\" style=\"min-height:46px\">Traer cambios<\u002Fbutton>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n            <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Cómo se conecta<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700)\">una sola vez<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ pasos }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:11px;align-items:flex-start\">\n                <div style=\"flex:0 0 26px;font-family:var(--font-heading);font-size:16px;color:var(--color-accent-700)\">{{ p.num }}<\u002Fdiv>\n                <div style=\"flex:1;font-size:12.5px;line-height:1.45\">{{ p.texto }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n            <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">En este equipo<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ colaTexto }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportar }}\" style=\"flex:1;min-width:150px;justify-content:center;min-height:44px\">Exportar CSV<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ enviarCola }}\" style=\"min-height:44px\">Reintentar envío<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n   <\u002Fdiv>\n  <\u002Fmain>\n\n  <nav style=\"position:sticky;bottom:0;z-index:30;background:var(--color-bg);border-top:1px solid var(--color-divider)\">\n    <div class=\"wrap\" style=\"display:flex;padding:0\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{ t.onPick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <div style=\"{{ toastStyle }}\">{{ toast }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;apiUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conexión&quot;},&quot;rolInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vendedor&quot;,&quot;jefe&quot;,&quot;gerente&quot;],&quot;default&quot;:&quot;vendedor&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conexión&quot;},&quot;refrescoSegundos&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:45,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:300,&quot;step&quot;:15,&quot;section&quot;:&quot;Conexión&quot;},&quot;claveJefe&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;repuestos&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Accesos&quot;},&quot;claveGerente&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;posventa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Accesos&quot;},&quot;requiereRevision&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;},&quot;filasVisibles&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:300,&quot;step&quot;:10,&quot;section&quot;:&quot;Comportamiento&quot;}}\">\nconst USD = n => 'USD ' + Math.round(n || 0).toLocaleString('es-AR');\nconst KUSD = n => n >= 1000000 ? 'USD ' + (n / 1000000).toFixed(1) + 'M' : n >= 1000 ? 'USD ' + Math.round(n / 1000) + 'k' : USD(n);\nconst hoyISO = () => new Date().toISOString().slice(0, 10);\nconst diasAtras = d => new Date(Date.now() - d * 864e5).toISOString().slice(0, 10);\n\nconst TIPOS = ['Visita', 'Llamado', 'WhatsApp', 'Mostrador'];\nconst TEMAS = ['Repuestos', 'Service', 'Garantía', 'Contrato', 'Reclamo', 'Equipo nuevo'];\nconst RESULTADOS = ['Pidió presupuesto', 'Compró', 'Interesado', 'Sin necesidad', 'No estaba'];\nconst EST = {\n  pendiente: { label: 'Pendiente', cls: 'tag tag-outline' },\n  aprobada: { label: 'Aprobada', cls: 'tag tag-accent' },\n  observada: { label: 'Devuelta', cls: 'tag tag-neutral' },\n  local: { label: 'Sin enviar', cls: 'tag tag-neutral' },\n  desconocido: { label: 'Sin estado', cls: 'tag tag-outline' }\n};\n\nconst texto = v => v == null ? '' : String(v).trim();\n// Los nombres se escriben distinto en cada equipo: \"Sebastián\" y \"sebastian\n// ledesma\" tienen que ser la misma persona o el vendedor no ve su salida.\nconst norm = v => texto(v).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/\\s+/g, ' ');\nconst mismaPersona = (a, b) => {\n  const x = norm(a), y = norm(b);\n  if (!x || !y) return false;\n  if (x === y || x.indexOf(y) === 0 || y.indexOf(x) === 0) return true;\n  const px = x.split(' ').filter(Boolean), py = y.split(' ').filter(Boolean);\n  return px.length > 0 && py.length > 0 && px[0] === py[0] &&\n    (px.length === 1 || py.length === 1 || px[px.length - 1] === py[py.length - 1]);\n};\nconst fechaOk = v => /^\\d{4}-\\d{2}-\\d{2}$/.test(texto(v)) ? texto(v) : '';\nconst num = v => { const n = Number(String(v == null ? 0 : v).replace(',', '.')); return isNaN(n) ? 0 : n; };\nconst estadoOk = v => {\n  const t = texto(v).toLowerCase();\n  const k = ['pendiente', 'aprobada', 'observada'].find(e => t.indexOf(e) === 0);\n  return k || (t ? 'desconocido' : 'pendiente');\n};\n\n// Toda visita que entra —de la planilla o del respaldo local— pasa por acá:\n// una hoja con otro esquema no puede ensuciar la pantalla ni los cálculos.\nconst sanear = v => ({\n  id: texto(v && v.id), ts: num(v && v.ts), fecha: fechaOk(v && v.fecha),\n  vendedor: texto(v && v.vendedor), cliente: texto(v && v.cliente), localidad: texto(v && v.localidad),\n  contacto: texto(v && v.contacto), tipo: texto(v && v.tipo), tema: texto(v && v.tema),\n  resultado: texto(v && v.resultado), monto: num(v && v.monto), obs: texto(v && v.obs),\n  proximo: fechaOk(v && v.proximo), proximoTipo: texto(v && v.proximoTipo),\n  estado: estadoOk(v && v.estado), devolucion: texto(v && v.devolucion),\n  revisadoPor: texto(v && v.revisadoPor), revisadoTs: num(v && v.revisadoTs),\n  pendienteEnvio: !!(v && v.pendienteEnvio)\n});\n\nconst chip = on => ({\n  minHeight: '40px', padding: '0 13px', whiteSpace: 'nowrap', cursor: 'pointer', borderRadius: 0,\n  fontFamily: 'var(--font-heading)', fontSize: '13.5px', letterSpacing: '.05em', textTransform: 'uppercase',\n  border: '1px solid ' + (on ? 'var(--color-accent-800)' : 'var(--color-divider)'),\n  background: on ? 'var(--color-accent-800)' : 'transparent',\n  color: on ? 'var(--color-neutral-100)' : 'var(--color-neutral-800)'\n});\n\nclass Component extends DCLogic {\n  state = {\n    rol: 'vendedor', pantalla: 'hoy', form: null,\n    visitas: [], cola: [], sync: 'off', syncTs: 0, syncErr: '',\n    api: '', me: '', apiEdit: '', meEdit: '',\n    filtroMis: 'todas', filtroEquipo: 'pendiente', filtroVendedor: 'todos', periodo: '30',\n    toast: '', clientes: [], busqueda: '', chipCartera: 'todos', cod: null,\n    sesion: null, ingresoRol: 'vendedor', ingresoNombre: '', clave: '', errorIngreso: '',\n    salidas: [], armado: [], locSel: null, filtroMapa: 'todos', altas: [], altaForm: null,\n    salidaVendedor: '', salidaTitulo: '', salidaDesde: hoyISO(), salidaHasta: ''\n  };\n\n  componentDidUpdate() {\n    if (this.state.pantalla === 'salidas' && this.state.rol !== 'vendedor') {\n      this.montarMapa();\n      this.dibujarMapa();\n    }\n  }\n\n  pantallasDe(rol) {\n    return rol === 'vendedor'\n      ? ['hoy', 'salidas', 'cartera', 'ficha', 'form', 'mis', 'ajustes', 'alta']\n      : ['equipo', 'salidas', 'cartera', 'ficha', 'tablero', 'mis', 'form', 'ajustes', 'alta'];\n  }\n\n  // ── Salidas ─────────────────────────────────────────────\n  motivoSugerido(c) {\n    if (!c) return 'Relevar necesidad de repuestos y service.';\n    if (c.st === 'Inactivo' && c.th > 20000) return 'Recuperar: ' + (c.asn || '+2') + ' años sin comprar, histórico ' + KUSD(c.th) + '.';\n    if (c.g > 0) return 'Post-garantía: ' + c.g + ' unidad(es) por vencer, ofrecer contrato de service.';\n    if (c.tp && c.antig >= 15 && c.antig <= 60) return 'Parque de ' + c.antig + ' años promedio: alta demanda de repuestos, plan de recambio.';\n    if (!c.tp && c.th > 20000) return 'Factura mostrador sin parque registrado: verificar equipo real.';\n    if (c.t > 0) return 'Potencial ' + KUSD(c.t) + '/año en repuestos y service.';\n    return 'Relevar necesidad de repuestos y service.';\n  }\n\n  paradaDe(c) {\n    return {\n      cod: c.c, cliente: c.n, localidad: [c.l, c.p].filter(Boolean).join(', '),\n      lat: c.lat || 0, lng: c.lng || 0, motivo: this.motivoSugerido(c),\n      estado: 'pendiente', nota: '', visitaId: '', fecha: ''\n    };\n  }\n\n  // Vecino más cercano desde la primera parada: alcanza y sobra para una gira.\n  ordenarCercania(paradas) {\n    if (paradas.length < 3) return paradas.slice();\n    const rest = paradas.slice(1), out = [paradas[0]];\n    const d = (a, b) => Math.pow(a.lat - b.lat, 2) + Math.pow(a.lng - b.lng, 2);\n    while (rest.length) {\n      const ult = out[out.length - 1];\n      let mejor = 0;\n      for (let i = 1; i < rest.length; i++) if (d(ult, rest[i]) < d(ult, rest[mejor])) mejor = i;\n      out.push(rest.splice(mejor, 1)[0]);\n    }\n    return out;\n  }\n\n  mapsDeParadas(paradas) {\n    const pts = paradas.filter(p => p.lat && p.lng).slice(0, 10).map(p => p.lat + ',' + p.lng);\n    if (!pts.length) return 'https://www.google.com/maps';\n    if (pts.length === 1) return 'https://www.google.com/maps/search/?api=1&query=' + pts[0];\n    return 'https://www.google.com/maps/dir/?api=1&origin=' + pts[0] + '&destination=' + pts[pts.length - 1]\n      + (pts.length > 2 ? '&waypoints=' + encodeURIComponent(pts.slice(1, -1).join('|')) : '') + '&travelmode=driving';\n  }\n\n  async pushSalida(s) {\n    const salidas = this.state.salidas.filter(x => x.id !== s.id).concat([s])\n      .sort((a, b) => (b.desde || '').localeCompare(a.desde || ''));\n    this.setState({ salidas });\n    try { localStorage.setItem('vc_salidas', JSON.stringify(salidas)); } catch (e) {}\n    try {\n      this.recibir(await this.jsonp({ action: 'salida', payload: JSON.stringify(s), desde: diasAtras(120) }));\n    } catch (e) {\n      this.setState({ sync: 'err', syncErr: String(e.message || e) });\n      this.toast('Guardado en este equipo · se envía cuando haya señal');\n    }\n  }\n\n  cambiarParada(salida, i, patch) {\n    const paradas = salida.paradas.map((p, j) => j === i ? Object.assign({}, p, patch) : p);\n    const hechas = paradas.filter(p => p.estado === 'hecha').length;\n    const estado = hechas >= paradas.filter(p => p.estado !== 'rechazada').length && paradas.length ? 'cerrada' : 'en curso';\n    this.pushSalida(Object.assign({}, salida, { paradas, estado }));\n  }\n\n  // El mapa vive fuera de React: se crea una vez y se redibuja al cambiar filtro.\n  montarMapa() {\n    if (!this._mapaEl || this._mapa || !window.L) return;\n    const L = window.L;\n    this._mapa = L.map(this._mapaEl, { scrollWheelZoom: false }).setView([-33.6, -62.3], 6);\n    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {\n      maxZoom: 17, attribution: '© OpenStreetMap'\n    }).addTo(this._mapa);\n    this._capa = L.layerGroup().addTo(this._mapa);\n    setTimeout(() => this._mapa && this._mapa.invalidateSize(), 200);\n    this.dibujarMapa();\n  }\n\n  gruposLocalidad() {\n    const g = {};\n    this.carteraEfectiva().forEach(c => {\n      if (!c.lat || !c.lng) return;\n      const k = (c.l || 'Sin localidad') + '|' + (c.p || '');\n      if (!g[k]) g[k] = { key: k, loc: c.l || 'Sin localidad', prov: c.p || '', lat: c.lat, lng: c.lng, cli: [] };\n      g[k].cli.push(c);\n    });\n    return g;\n  }\n\n  clientesFiltro(cli) {\n    const f = this.state.filtroMapa;\n    if (f === 'inactivos') return cli.filter(c => c.st === 'Inactivo');\n    if (f === 'garantia') return cli.filter(c => c.g > 0);\n    if (f === 'A') return cli.filter(c => c.abc === 'A');\n    if (f === 'parque') return cli.filter(c => c.tp && c.antig >= 15 && c.antig <= 60);\n    return cli;\n  }\n\n  // Cada punto dice algo: color = por qué ir, tamaño = cuántos clientes,\n  // relleno lleno = ya está en la salida que se está armando.\n  perfilZona(cli) {\n    const inact = cli.filter(c => c.st === 'Inactivo').length;\n    const gar = cli.filter(c => c.g > 0).length;\n    const viejo = cli.filter(c => c.tp && c.antig >= 15 && c.antig <= 60).length;\n    const n = cli.length;\n    if (inact / n >= .5) return { k: 'inactivos', color: '#d1495b', label: 'Mayoría inactivos' };\n    if (gar > 0 && gar / n >= .25) return { k: 'garantia', color: '#00a0df', label: gar + ' en garantía' };\n    if (viejo / n >= .4) return { k: 'parque', color: '#ffd100', label: 'Parque envejecido' };\n    return { k: 'activos', color: '#004e9a', label: 'Cartera activa' };\n  }\n\n  dibujarMapa() {\n    if (!this._mapa || !this._capa || !window.L) return;\n    const L = window.L;\n    this._capa.clearLayers();\n    const grupos = this.gruposLocalidad();\n    const sel = this.state.locSel;\n    const pots = [];\n    Object.keys(grupos).forEach(k => {\n      const cli = this.clientesFiltro(grupos[k].cli);\n      if (cli.length) pots.push(cli.reduce((a, c) => a + (c.t || c.th || 0), 0));\n    });\n    const maxPot = Math.max(1, ...pots);\n    Object.keys(grupos).forEach(k => {\n      const g = grupos[k];\n      const cli = this.clientesFiltro(g.cli);\n      if (!cli.length) return;\n      const pot = cli.reduce((a, c) => a + (c.t || c.th || 0), 0);\n      const perfil = this.perfilZona(cli);\n      const elegidos = this.state.armado.filter(p => cli.some(c => c.c === p.cod)).length;\n      const activo = k === sel;\n      const r = 6 + Math.sqrt(pot / maxPot) * 16 + Math.min(6, cli.length / 4);\n      L.circleMarker([g.lat, g.lng], {\n        radius: Math.round(r), color: elegidos || activo ? '#002a56' : perfil.color,\n        weight: activo ? 4 : elegidos ? 3 : 1.5,\n        fillColor: perfil.color, fillOpacity: elegidos ? .95 : .35,\n        dashArray: elegidos ? null : (perfil.k === 'inactivos' ? '3 3' : null)\n      })\n        .bindTooltip(\n          '<b>' + g.loc + '<\u002Fb><br>' + cli.length + ' clientes · ' + KUSD(pot) + '/año<br>' + perfil.label\n            + (elegidos ? '<br><b>' + elegidos + ' en la salida<\u002Fb>' : ''),\n          { direction: 'top' })\n        .on('click', () => { this.setState({ locSel: k }); })\n        .addTo(this._capa);\n    });\n  }\n\n  // ── Altas de clientes y máquinas ──\n  async pushAlta(a) {\n    const altas = this.state.altas.filter(x => x.id !== a.id).concat([a]).sort((x, y) => y.ts - x.ts);\n    this.setState({ altas });\n    try { localStorage.setItem('vc_altas', JSON.stringify(altas)); } catch (e) {}\n    try {\n      this.recibir(await this.jsonp({ action: 'alta', payload: JSON.stringify(a), desde: diasAtras(120) }));\n    } catch (e) {\n      this.setState({ sync: 'err', syncErr: String(e.message || e) });\n      this.toast('Guardado acá · se envía cuando haya señal');\n    }\n  }\n\n  // La base que ve la app = cartera original + altas ya aprobadas.\n  carteraEfectiva() {\n    const base = this.state.clientes.map(c => Object.assign({}, c));\n    const porCod = {};\n    base.forEach(c => { porCod[c.c] = c; });\n    this.state.altas.filter(a => a.estado === 'aprobada').forEach(a => {\n      if (a.tipo === 'cliente') {\n        const d = a.datos || {};\n        if (porCod[a.codCliente]) return;\n        const nuevo = {\n          c: a.codCliente || a.id, n: a.cliente || d.n || 'Sin nombre', cuit: d.cuit || '',\n          p: d.p || '', l: d.l || '', contacto: d.contacto || '', tel: d.tel || '',\n          u: 0, g: 0, antig: 0, t: 0, tr: 0, ts: 0, th: 0, cmp: 0, h: [],\n          st: 'Nuevo', abc: '', tp: false, m: [], nuevoDeCampo: true,\n          lat: Number(d.lat) || 0, lng: Number(d.lng) || 0\n        };\n        base.push(nuevo);\n        porCod[nuevo.c] = nuevo;\n      } else if (a.tipo === 'maquina') {\n        const c = porCod[a.codCliente];\n        if (!c) return;\n        const d = a.datos || {};\n        c.m = (c.m || []).concat([{\n          md: d.md || 'Sin modelo', an: d.an || '', ds: d.ds || '', gr: d.gr || 'Fuera de garantia',\n          ns: d.ns || '', pr: 0, ps: 0, deCampo: true\n        }]);\n        c.u = (c.u || 0) + 1;\n        c.tp = true;\n        if (String(d.gr).toLowerCase().indexOf('en garantia') === 0) c.g = (c.g || 0) + 1;\n      }\n    });\n    return base;\n  }\n\n  revisarAlta(a, estado) {\n    let devolucion = '';\n    if (estado === 'rechazada') {\n      const d = window.prompt('¿Qué le falta o por qué se rechaza?', 'Faltan datos: CUIT y localidad.');\n      if (d == null) return;\n      devolucion = d;\n    }\n    this.pushAlta(Object.assign({}, a, {\n      estado, devolucion, revisadoPor: this.state.me || 'Jefatura', revisadoTs: Date.now()\n    }));\n    this.toast(estado === 'aprobada' ? 'Aprobada · ya está en la base de todos' : 'Rechazada · vuelve al vendedor');\n  }\n\n  entrar() {\n    const nombre = texto(this.state.ingresoNombre);\n    const rol = this.state.ingresoRol;\n    if (!nombre) return this.setState({ errorIngreso: 'Poné tu nombre para que las visitas queden firmadas.' });\n    if (rol !== 'vendedor') {\n      const esperada = rol === 'jefe'\n        ? texto(this.props.claveJefe ?? 'repuestos')\n        : texto(this.props.claveGerente ?? 'posventa');\n      if (texto(this.state.clave).toLowerCase() !== esperada.toLowerCase()) {\n        return this.setState({ errorIngreso: 'Clave incorrecta para ese rol.' });\n      }\n    }\n    const sesion = { rol, nombre };\n    try { localStorage.setItem('vc_sesion', JSON.stringify(sesion)); } catch (e) {}\n    this.setState({\n      sesion, rol, me: nombre, meEdit: nombre, clave: '', errorIngreso: '',\n      pantalla: rol === 'vendedor' ? 'hoy' : rol === 'jefe' ? 'equipo' : 'tablero'\n    });\n    window.scrollTo(0, 0);\n  }\n\n  salir() {\n    try { localStorage.removeItem('vc_sesion'); } catch (e) {}\n    this.setState({ sesion: null, pantalla: 'ingreso', clave: '', errorIngreso: '' });\n    window.scrollTo(0, 0);\n  }\n\n  // La cartera puede llegar tarde: en el archivo empaquetado el script se\n  // descomprime después del primer render. Se espera en vez de darla por perdida.\n  // La antigüedad que trae la base se calculó con años de máquina en \"0\"\n  // (2026 - 0 = 2026), así que se recalcula ignorando los años imposibles.\n  // Sin años válidos queda en null: mejor sin dato que un dato inventado.\n  sanearAntiguedad(cl) {\n    const anioAct = new Date().getFullYear();\n    return cl.map(c => {\n      const anios = (c.m || []).map(m => Number(m.an)).filter(a => a >= 1950 && a <= anioAct);\n      let antig = null;\n      if (anios.length) antig = Math.round(anioAct - anios.reduce((a, b) => a + b, 0) / anios.length);\n      else if (Number(c.antig) > 0 && Number(c.antig) <= 60) antig = Number(c.antig);\n      return Object.assign({}, c, { antig });\n    });\n  }\n\n  cargarClientes(intento) {\n    const n = intento || 0;\n    if (Array.isArray(window.__CLIENTES) && window.__CLIENTES.length) {\n      return this.setState({ clientes: this.sanearAntiguedad(window.__CLIENTES) });\n    }\n    if (n < 40) return void setTimeout(() => this.cargarClientes(n + 1), 250);\n    fetch('data/clientes.json')\n      .then(r => r.json())\n      .then(cl => { if (Array.isArray(cl)) this.setState({ clientes: this.sanearAntiguedad(cl) }); })\n      .catch(() => {});\n  }\n\n  cliente(cod) { return this.carteraEfectiva().find(c => c.c === cod) || null; }\n\n  abrirFicha(cod) { this.setState({ cod, pantalla: 'ficha' }); window.scrollTo(0, 0); }\n\n  componentDidMount() {\n    let api = '', me = '', visitas = [], cola = [];\n    try {\n      const cfg = JSON.parse(localStorage.getItem('vc_cfg') || '{}');\n      api = cfg.api || this.props.apiUrl\n        || 'https://script.google.com/macros/s/AKfycbyyjK-nvXCh8m58g8iLnljlcKwk-jclDtbt-9qsuVuwURo935ih1d2HV2n1w6fuSozP/exec';\n      me = cfg.me || '';\n      visitas = JSON.parse(localStorage.getItem('vc_cache') || '[]').map(sanear).filter(v => v.id);\n      cola = JSON.parse(localStorage.getItem('vc_cola') || '[]').map(sanear).filter(v => v.id);\n      const sal = JSON.parse(localStorage.getItem('vc_salidas') || '[]');\n      if (Array.isArray(sal)) this.setState({ salidas: sal });\n      const alt = JSON.parse(localStorage.getItem('vc_altas') || '[]');\n      if (Array.isArray(alt)) this.setState({ altas: alt });\n    } catch (e) {}\n    this.cargarClientes();\n    let sesion = null;\n    try { sesion = JSON.parse(localStorage.getItem('vc_sesion') || 'null'); } catch (e) {}\n al(patch) {\n    this.setState(patch);\n    try {\n      if (patch.visitas) localStorage.setItem('vc_cache', JSON.stringify(patch.visitas));\n      if (patch.cola) localStorage.setItem('vc_cola', JSON.stringify(patch.cola));\n    } catch (e) {}\n  }\n\n  // JSONP: mismo camino que el Tablero de Citas, así el navegador no choca con CORS.\n  jsonp(params) {\n    const api = this.state.api;\n    return new Promise((resolve, reject) => {\n      if (!api) return reject(new Error('sin URL de planilla'));\n      const cb = 'vc_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);\n      const tag = document.createElement('script');\n      const limpiar = () => { delete window[cb]; if (tag.parentNode) tag.remove(); };\n      const to = setTimeout(() => { limpiar(); reject(new Error('tiempo agotado')); }, 20000);\n      window[cb] = data => { clearTimeout(to); limpiar(); resolve(data); };\n      tag.onerror = () => { clearTimeout(to); limpiar(); reject(new Error('no responde')); };\n      tag.src = api + '?' + new URLSearchParams(Object.assign({ callback: cb }, params)).toString();\n      document.head.appendChild(tag);\n    });\n  }\n\n  recibir(r) {\n    if (!r || r.ok === false) throw new Error((r && r.error) || 'respuesta inválida');\n    const visitas = (r.visitas || []).map(sanear).filter(v => v.id)\n      .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.ts - a.ts);\n    const enviadas = {};\n    visitas.forEach(v => { enviadas[v.id] = true; });\n    const cola = this.state.cola.filter(v => !enviadas[v.id]);\n    this.guardarLocal({ visitas, cola, sync: 'ok', syncTs: Date.now(), syncErr: '' });\n    if (Array.isArray(r.altas)) {\n      this.setState({ altas: r.altas });\n      try { localStorage.setItem('vc_altas', JSON.stringify(r.altas)); } catch (e) {}\n    }\n    if (Array.isArray(r.salidas)) {\n      const salidas = r.salidas.sort((a, b) => (b.desde || '').localeCompare(a.desde || ''));\n      this.setState({ salidas });\n      try { localStorage.setItem('vc_salidas', JSON.stringify(salidas)); } catch (e) {}\n    }\n  }\n\n  async refrescar(silencioso) {\n    if (!this.state.api) { this.setState({ sync: 'off' }); if (!silencioso) this.toast('Falta la URL de la planilla'); return; }\n    if (this.state.cola.length) return this.enviarCola(silencioso);\n    this.setState({ sync: 'syncing' });\n    try {\n      this.recibir(await this.jsonp({ action: 'get', desde: diasAtras(120) }));\n      if (!silencioso) this.toast('Al día con la planilla');\n    } catch (e) {\n      this.setState({ sync: 'err', syncErr: String(e.message || e) });\n      if (!silencioso) this.toast('Sin conexión con la planilla');\n    }\n  }\n\n  async enviarCola(silencioso) {\n    const cola = this.state.cola;\n    if (!this.state.api) { this.setState({ sync: 'off' }); return; }\n    if (!cola.length) return this.refrescar(silencioso);\n    this.setState({ sync: 'syncing' });\n    try {\n      this.recibir(await this.jsonp({ action: 'save', payload: JSON.stringify(cola), desde: diasAtras(120) }));\n      if (!silencioso) this.toast(cola.length + ' visita(s) enviadas');\n    } catch (e) {\n      this.setState({ sync: 'err', syncErr: String(e.message || e) });\n      if (!silencioso) this.toast('Guardado en el teléfono · se envía cuando haya señal');\n    }\n  }\n\n  async revisar(v, estado, devolucion) {\n    const visitas = this.state.visitas.map(x => x.id === v.id\n      ? Object.assign({}, x, { estado, devolucion, revisadoPor: this.state.me || 'Jefatura', revisadoTs: Date.now() }) : x);\n    this.guardarLocal({ visitas });\n    try {\n      this.recibir(await this.jsonp({\n        action: 'revisar', id: v.id, estado, devolucion: devolucion || '',\n        quien: this.state.me || 'Jefatura', desde: diasAtras(120)\n      }));\n      this.toast(estado === 'aprobada' ? 'Aprobada · el vendedor la ve enseguida' : 'Devuelta al vendedor');\n    } catch (e) {\n      this.setState({ sync: 'err', syncErr: String(e.message || e) });\n      this.toast('No se pudo avisar a la planilla · reintentá');\n    }\n  }\n\n  // Una fila del esquema viejo (CRM) llega con las columnas corridas: el nombre\n  // del cliente trae una fecha, el resultado un monto. No se puede reparar acá,\n  // así que se aparta y se avisa en vez de mostrarla como visita legítima.\n  coherente(v) {\n    if (!v.cliente) return false;\n    if (/GMT|^\\w{3} \\w{3} \\d{1,2} \\d{4}|^\\d{4}-\\d{2}-\\d{2}$/.test(v.cliente)) return false;\n    if (/^\\d+([.,]\\d+)?$/.test(v.resultado)) return false;\n    if (!v.fecha && !v.tema && !v.tipo) return false;\n    return true;\n  }\n\n  todasCrudas() {\n    const ids = {};\n    this.state.visitas.forEach(v => { ids[v.id] = true; });\n    return this.state.cola.filter(v => !ids[v.id]).map(v => Object.assign({}, v, { pendienteEnvio: true }))\n      .concat(this.state.visitas)\n      .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.ts || 0) - (a.ts || 0));\n  }\n\n  todas() { return this.todasCrudas().filter(v => this.coherente(v)); }\n\n  descartadas() { return this.todasCrudas().filter(v => !this.coherente(v)); }\n\n  vista(v) {\n    const e = v.pendienteEnvio ? EST.local : (EST[v.estado] || EST.desconocido);\n    return {\n      id: v.id, cliente: v.cliente || 'Sin cliente', estadoLabel: e.label, estadoCls: e.cls,\n      fecha: v.fecha || 'sin fecha', vendedor: v.vendedor || '—', resultado: v.resultado || '—',\n      monto: v.monto ? KUSD(v.monto) : '—',\n      meta: [v.fecha, v.localidad, v.tipo, v.vendedor].filter(Boolean).join(' · '),\n      resumen: [v.tema, v.resultado].filter(Boolean).join(' → ') + (v.obs ? '. ' + v.obs : ''),\n      proximoTexto: v.proximo ? 'Vuelve ' + v.proximo + (v.proximoTipo ? ' · ' + v.proximoTipo : '') : 'Sin próximo paso anotado',\n      devolucion: v.devolucion ? (v.revisadoPor || 'Jefatura') + ': ' + v.devolucion : '',\n      onOpen: () => this.editar(v),\n      onEditar: () => this.editar(v),\n      aprobar: () => this.revisar(v, 'aprobada', ''),\n      observar: () => {\n        const d = window.prompt('¿Qué falta o qué le pedís al vendedor?', 'Falta detalle del repuesto y plazo comprometido.');\n        if (d != null) this.revisar(v, 'observada', d);\n      }\n    };\n  }\n\n  nueva(cli) {\n    this.setState({\n      pantalla: 'form', desdeFicha: !!cli,\n      form: {\n        id: 'v' + Date.now() + Math.random().toString(36).slice(2, 6), ts: Date.now(), nuevo: true,\n        fecha: hoyISO(), vendedor: this.state.me,\n        cliente: cli ? cli.n : '', localidad: cli ? [cli.l, cli.p].filter(Boolean).join(', ') : '', contacto: '',\n        tipo: 'Visita', tema: 'Repuestos', resultado: 'Interesado', monto: '', obs: '',\n        proximo: '', proximoTipo: 'Visita', estado: 'pendiente', devolucion: ''\n      }\n    });\n    window.scrollTo(0, 0);\n  }\n\n  editar(v) {\n    this.setState({ pantalla: 'form', form: Object.assign({}, v, { nuevo: false, monto: v.monto || '' }) });\n    window.scrollTo(0, 0);\n  }\n\n  guardar() {\n    const f = this.state.form;\n    if (!f.cliente.trim()) return this.toast('Poné el nombre del cliente');\n    const v = Object.assign({}, f, {\n      cliente: f.cliente.trim(), vendedor: (f.vendedor || '').trim() || 'Sin identificar',\n      monto: Number(f.monto) || 0, estado: f.estado === 'observada' ? 'pendiente' : (f.estado || 'pendiente')\n    });\n    delete v.nuevo;\n    const cola = this.state.cola.filter(x => x.id !== v.id).concat([v]);\n    const visitas = this.state.visitas.map(x => x.id === v.id ? Object.assign({}, x, v) : x);\n    try { localStorage.setItem('vc_cfg', JSON.stringify({ api: this.state.api, me: v.vendedor })); } catch (e) {}\n    this.guardarLocal({ cola, visitas });\n    const pa = this._paradaActiva;\n    this._paradaActiva = null;\n    if (pa) {\n      const sal = this.state.salidas.find(x => x.id === pa.salidaId);\n      if (sal) this.cambiarParada(sal, pa.i, { estado: 'hecha', visitaId: v.id, fecha: v.fecha });\n    }\n    this.setState({ me: v.vendedor, cion = () => {\n      if (!navigator.geolocation) return this.toast('Este equipo no da ubicación');\n      navigator.geolocation.getCurrentPosition(\n        pos => this.setState({ altaForm: Object.assign({}, this.state.altaForm, { lat: pos.coords.latitude, lng: pos.coords.longitude }) }),\n        () => this.toast('No se pudo tomar la ubicación')\n      );\n    };\n    vals.enviarAlta = () => {\n      if (A.tipo === 'cliente') {\n        if (!texto(A.n) || !texto(A.l) || !texto(A.p)) return this.toast('Faltan nombre, localidad y provincia');\n      } else if (!texto(A.md)) return this.toast('Poné al menos el modelo');\n      const alta = {\n        id: 'a' + Date.now() + Math.random().toString(36).slice(2, 5), ts: Date.now(),\n        tipo: A.tipo, vendedor: s.me || 'Sin identificar',\n        cliente: A.tipo === 'cliente' ? texto(A.n) : texto(A.cliente),\n        codCliente: A.tipo === 'cliente' ? ('N' + Date.now().toString(36).toUpperCase()) : texto(A.cod),\n        datos: A.tipo === 'cliente'\n          ? { n: texto(A.n), cuit: texto(A.cuit), tel: texto(A.tel), l: texto(A.l), p: texto(A.p), contacto: texto(A.contacto), obs: texto(A.obs), lat: A.lat || 0, lng: A.lng || 0 }\n          : { md: texto(A.md), an: texto(A.an), ns: texto(A.ns), hs: texto(A.hs), ds: texto(A.ds), gr: A.gr || 'Fuera de garantia', obs: texto(A.obs) },\n        estado: 'pendiente', devolucion: '', revisadoPor: '', revisadoTs: 0\n      };\n      this.pushAlta(alta);\n      this.setState({ pantalla: A.volver || 'cartera', altaForm: null });\n      this.toast(A.tipo === 'cliente' ? 'Cliente enviado a revisión' : 'Máquina enviada a revisión');\n      window.scrollTo(0, 0);\n    };\n    const pend = s.altas.filter(a => a.estado === 'pendiente');\n    vals.hayAltas = pend.length > 0 && s.rol !== 'vendedor';\n    vals.altasResumen = pend.length + ' pendientes · ' + s.altas.filter(a => a.estado === 'aprobada').length + ' aprobadas';\n    const etiqueta = { n: 'Nombre', cuit: 'CUIT', tel: 'Teléfono', l: 'Localidad', p: 'Provincia', contacto: 'Contacto', obs: 'Comentarios', md: 'Modelo', an: 'Año', ns: 'N° serie', hs: 'Horas', ds: 'Tipo', gr: 'Garantía' };\n    vals.altasPendientes = pend.map(a => ({\n      titulo: a.cliente || 'Sin nombre',\n      tipoLabel: a.tipo === 'cliente' ? 'Cliente nuevo' : 'Máquina',\n      meta: [a.vendedor, new Date(a.ts).toLocaleDateString('es-AR')].filter(Boolean).join(' · '),\n      campos: Object.keys(a.datos || {}).filter(k => etiqueta[k] && texto(a.datos[k]))\n        .map(k => ({ k: etiqueta[k], v: texto(a.datos[k]) })),\n      aprobar: () => this.revisarAlta(a, 'aprobada'),\n      rechazar: () => this.revisarAlta(a, 'rechazada')\n    }));\n\n    // Formulario\n    const f = s.form || { fecha: '', vendedor: '', cliente: '', localidad: '', contacto: '', tipo: 'Visita', tema: '', resultado: '', monto: '', obs: '', proximo: '', proximoTipo: 'Visita' };\n    vals.form = f;\n    vals.formKicker = s.form && !s.form.nuevo ? 'Corrigiendo lo cargado' : 'Nueva carga';\n    const set = k => e => this.setState({ form: Object.assign({}, this.state.form, { [k]: e.target.value }) });\n    vals.setCliente = set('cliente'); vals.setLocalidad = set('localidad'); vals.setFecha = set('fecha');\n    vals.setContacto = set('contacto'); vals.setMonto = set('monto'); vals.setVendedor = set('vendedor');\n    vals.setObs = set('obs'); vals.setProximo = set('proximo'); vals.setProximoTipo = set('proximoTipo');\n    const pick = (k, v) => () => this.setState({ form: Object.assign({}, this.state.form, { [k]: v }) });\n    vals.tipos = TIPOS.map(t => ({ label: t, onPick: pick('tipo', t), style: chip(f.tipo === t) }));\n    vals.temas = TEMAS.map(t => ({ label: t, onPick: pick('tema', t), style: chip(f.tema === t) }));\n    vals.resultados = RESULTADOS.map(t => ({ label: t, onPick: pick('resultado', t), style: chip(f.resultado === t) }));\n    const escrito = texto(f.cliente).toLowerCase();\n    const deBase = escrito.length >= 2\n      ? CL.filter(c => (c.n || '').toLowerCase().includes(escrito)).slice(0, 30).map(c => c.n)\n      : [];\n    vals.sugerencias = [...new Set(todas.map(v => v.cliente).filter(Boolean).concat(deBase))].slice(0, 60);\n    vals.textoGuardado = (this.props.requiereRevision ?? true)\n      ? 'Se guarda en el equipo, se envía a la planilla y queda pendiente de revisión del jefe de repuestos. El gerente la ve en el tablero.'\n      : 'Se guarda y se envía a la planilla, sin revisión.';\n\n    // Mis visitas\n    const chipsMis = [['todas', 'Todas'], ['pendiente', 'Pendientes'], ['aprobada', 'Aprobadas'], ['observada', 'Devueltas']];\n    vals.misChips = chipsMis.map(([k, label]) => ({\n      label: label + ' ' + (k === 'todas' ? mias.length : mias.filter(v => v.estado === k).length),\n      onPick: () => this.setState({ filtroMis: k }), style: chip(s.filtroMis === k)\n    }));\n    const listaMis = (s.rol === 'vendedor' ? mias : todas).filter(v => s.filtroMis === 'todas' || v.estado === s.filtroMis);\n    vals.misVisitas = listaMis.slice(0, this.props.filasVisibles ?? 60).map(v => this.vista(v));\n    vals.sinMisVisitas = listaMis.length === 0;\n    vals.misResumen = listaMis.length + ' visitas · ' + KUSD(listaMis.reduce((a, v) => a + (v.monto || 0), 0));\n\n    // Equipo / revisión\n    const chipsEq = [['pendiente', 'Pendientes'], ['observada', 'Devueltas'], ['aprobada', 'Aprobadas'], ['todas', 'Todas']];\n    vals.equipoChips = chipsEq.map(([k, label]) => ({\n      label: label + ' ' + (k === 'todas' ? todas.length : todas.filter(v => v.estado === k).length),\n      onPick: () => this.setState({ filtroEquipo: k }), style: chip(s.filtroEquipo === k)\n    }));\n    const vendedores = [...new Set(todas.map(v => v.vendedor).filter(Boolean))];\n    vals.vendedorChips = [{ label: 'Todos', onPick: () => this.setState({ filtroVendedor: 'todos' }), style: chip(s.filtroVendedor === 'todos') }]\n      .concat(vendedores.map(n => ({ label: n, onPick: () => this.setState({ filtroVendedor: n }), style: chip(s.filtroVendedor === n) })));\n    const band = todas.filter(v => (s.filtroEquipo === 'todas' || v.estado === s.filtroEquipo)\n      && (s.filtroVendedor === 'todos' || v.vendedor === s.filtroVendedor));\n    vals.bandeja = band.slice(0, this.props.filasVisibles ?? 60).map(v => this.vista(v));\n    vals.bandejaVacia = band.length === 0;\n    vals.equipoKpis = [\n      { valor: String(todas.filter(v => v.fecha === hoy).length), label: 'Cargadas hoy' },\n      { valor: String(todas.filter(v => v.estado === 'pendiente').length), label: 'Sin revisar' },\n      { valor: String(vendedores.length), label: 'Vendedores activos' },\n      { valor: KUSD(todas.filter(v => v.fecha >= diasAtras(7)).reduce((a, v) => a + (v.monto || 0), 0)), label: 'En juego 7 días' }\n    ];\n\n    // Tablero\n    const dias = Number(s.periodo);\n    vals.periodoChips = [['7', '7 días'], ['30', '30 días'], ['90', '90 días']].map(([k, label]) => ({\n      label, onPick: () => this.setState({ periodo: k }), style: chip(s.periodo === k)\n    }));\n    const per = todas.filter(v => v.fecha >= diasAtras(dias));\n    vals.periodoTexto = 'últimos ' + dias + ' días';\n    const monto = arr => arr.reduce((a, v) => a + (v.monto || 0), 0);\n    const cerradas = per.filter(v => v.resultado === 'Compró');\n    vals.tableroKpis = [\n      { label: 'Visitas', valor: String(per.length), sub: 'últimos ' + dias + ' días' },\n      { label: 'Monto en juego', valor: KUSD(monto(per)), sub: 'declarado por los vendedores' },\n      { label: 'Cerradas', valor: String(cerradas.length), sub: KUSD(monto(cerradas)) + ' facturables' },\n      { label: 'Conversión', valor: per.length ? Math.round(cerradas.length / per.length * 100) + '%' : '—', sub: 'visitas que compraron' },\n      { label: 'Clientes tocados', valor: String(new Set(per.map(v => v.cliente)).size), sub: 'distintos en el período' },\n      { label: 'Sin revisar', valor: String(per.filter(v => v.estado === 'pendiente').length), sub: 'esperan al jefe de repuestos' }\n    ];\n    const porVend = {};\n    per.forEach(v => {\n      const k = v.vendedor || 'Sin identificar';\n      const r = porVend[k] = porVend[k] || { n: 0, monto: 0, cerradas: 0 };\n      r.n++; r.monto += v.monto || 0; if (v.resultado === 'Compró') r.cerradas++;\n    });\n    const maxM = Math.max(1, ...Object.keys(porVend).map(k => porVend[k].monto));\n    vals.ranking = Object.keys(porVend).sort((a, b) => porVend[b].monto - porVend[a].monto).map(k => ({\n      nombre: k, monto: KUSD(porVend[k].monto),\n      detalle: porVend[k].n + ' visitas · ' + porVend[k].cerradas + ' cerradas',\n      barStyle: { width: Math.max(2, Math.round(porVend[k].monto / maxM * 100)) + '%', background: 'var(--color-accent-600)' }\n    }));\n    vals.sinRanking = Object.keys(porVend).length === 0;\n    const maxR = Math.max(1, ...RESULTADOS.map(r => per.filter(v => v.resultado === r).length));\n    vals.embudo = RESULTADOS.map(r => {\n      const arr = per.filter(v => v.resultado === r);\n      return {\n        label: r, valor: arr.length + ' · ' + KUSD(monto(arr)),\n        barStyle: { width: Math.max(2, Math.round(arr.length / maxR * 100)) + '%', background: 'var(--color-accent-500)' }\n      };\n    });\n    vals.porTema = TEMAS.map(t => {\n      const arr = per.filter(v => v.tema === t);\n      return { tema: t, n: String(arr.length), monto: KUSD(monto(arr)) };\n    }).sort((a, b) => Number(b.n) - Number(a.n));\n    vals.exportarPeriodo = () => this.csv(per, 'informe-' + dias + 'dias');\n    vals.ultimas = per.slice(0, 25).map(v => this.vista(v));\n    vals.ultimasResumen = per.length + ' en ' + dias + ' días';\n\n    // Ajustes\n    vals.apiUrlEdit = s.apiEdit;\n    vals.miNombreEdit = s.meEdit;\n    vals.setApiUrl = e => this.setState({ apiEdit: e.target.value });\n    vals.setMiNombre = e => this.setState({ meEdit: e.target.value });\n    vals.guardarAjustes = () => {\n      const api = (s.apiEdit || '').trim(), me = (s.meEdit || '').trim();\n      try { localStorage.setItem('vc_cfg', JSON.stringify({ api, me })); } catch (e) {}\n      this.setState({ api, me }, () => this.refrescar(false));\n    };\n    vals.pasos = [\n      'Creá una hoja en Google Sheets y entrá a Extensiones ▸ Apps Script.',\n      'Pegá el código de apps-script/VendedorCampo.gs y guardá.',\n      'Implementar ▸ Nueva implementación ▸ Aplicación web. Ejecutar como: vos. Acceso: cualquier persona.',\n      'Copiá la URL /exec y pegala arriba, en los tres equipos (celular del vendedor, PC del jefe, PC del gerente).',\n      'Tocá “Guardar y sincronizar”. La hoja “Visitas” se crea sola y todos ven lo mismo.'\n    ].map((texto, i) => ({ num: String(i + 1).padStart(2, '0'), texto }));\n    vals.exportar = () => this.csv(todas, 'vendedor-a-campo');\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
