document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"3674e2e7-b78c-49dc-8ab1-b9d981caf1d0\"><\u002Fscript>\n<script src=\"eb3c5686-3b64-4ef5-a8c5-6cd7498d3e98\"><\u002Fscript>\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"cc2ae71b-89b1-49c0-9e0b-d8260167cd28\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-displ in-ext */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9ef09b1b-28cc-496f-831c-0c24aeb03b83\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b760858a-f7ec-4a0b-b15c-414a26588cab\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* Paleta New Holland sobre la estructura del sistema: azul institucional\n     como color de mando, amarillo sólo para lo que avanza o urge. */\n  :root{\n    --font-heading:'Archivo Narrow',system-ui,sans-serif;\n    --font-body:'Archivo',system-ui,sans-serif;\n    --color-accent:#004e9a;\n    --color-accent-100:#eaf2fc; --color-accent-200:#d0e2f6; --color-accent-300:#9fc4ea;\n    --color-accent-400:#5f9bd8; --color-accent-500:#2278c8; --color-accent-600:#0d61ad;\n    --color-accent-700:#004e9a; --color-accent-800:#003c78; --color-accent-900:#002a56;\n    --color-accent-2:#ffd100;\n    --color-accent-2-100:#fff8dd; --color-accent-2-200:#ffefb0; --color-accent-2-300:#ffe273;\n    --color-accent-2-400:#ffd633; --color-accent-2-500:#ffd100; --color-accent-2-600:#d9b100;\n    --color-accent-2-700:#a88a00; --color-accent-2-800:#7a6400; --color-accent-2-900:#544500;\n  }\n  html,body{margin:0;background:var(--color-neutral-200)}\n  a{color:var(--color-accent-700);text-decoration:none}\n  a:hover{color:var(--color-accent-900)}\n  input,select,textarea,button{font-family:var(--font-body)}\n  .cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}\n  .cols3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}\n  .wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 14px}\n  .scroll-x{overflow-x:auto}\n<\u002Fstyle>\n<script>\n  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {\n    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });\n  }\n<\u002Fscript>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:var(--color-neutral-200)\">\n\n  <header style=\"position:sticky;top:0;z-index:30;background:var(--color-accent-900);color:var(--color-neutral-100)\">\n    <div class=\"wrap\" style=\"display:flex;align-items:center;gap:12px;padding-top:11px;padding-bottom:10px\">\n      <div style=\"width:32px;height:32px;flex:0 0 32px;border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:14px;letter-spacing:.04em\">VC<\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-family:var(--font-heading);font-size:20px;line-height:1;text-transform:uppercase;letter-spacing:.03em\">Vendedor a campo<\u002Fdiv>\n        <div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-300);margin-top:3px\">Agroterra · Posventa<\u002Fdiv>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ irAjustes }}\" style=\"{{ syncBtnStyle }}\">\n        <span style=\"{{ syncDotStyle }}\"><\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;white-space:nowrap\">\n          <span style=\"font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.75\">Planilla<\u002Fspan>\n          <span style=\"font-family:var(--font-heading);font-size:13.5px;white-space:nowrap\">{{ syncTexto }}<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ sesionAbierta }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"wrap\" style=\"padding-bottom:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">{{ sesionTexto }}<\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ cerrarSesion }}\" style=\"min-height:34px;padding:0 11px;cursor:pointer;border-radius:0;background:none;border:1px solid rgba(255,255,255,.35);color:var(--color-neutral-100);font-family:var(--font-heading);font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap\">Cambiar usuario<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ hayAviso }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:var(--color-accent-200);border-bottom:1px solid var(--color-accent-400)\">\n      <div class=\"wrap\" style=\"padding-top:9px;padding-bottom:9px;font-size:12.5px;line-height:1.4;color:var(--color-accent-900)\">{{ avisoBanner }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main style=\"flex:1;padding:18px 0 26px\">\n   <div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:20px\">\n\n    <!-- ══ INGRESO ══ -->\n    <sc-if value=\"{{ esIngreso }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:480px;margin:20px auto;display:flex;flex-direction:column;gap:16px\">\n        <div>\n          <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Agroterra · Posventa<\u002Fdiv>\n          <h4 style=\"text-transform:uppercase;margin:5px 0 0\">¿Quién sos?<\u002Fh4>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:6px;line-height:1.45\">Cada uno ve lo que le corresponde. Queda guardado en este equipo, no hace falta repetirlo.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Tu nombre<\u002Flabel>\n          <input class=\"input\" type=\"text\" placeholder=\"Nombre y apellido\" value=\"{{ ingresoNombre }}\" sc-camel-on-input=\"{{ setIngresoNombre }}\" style=\"height:48px\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ opcionesRol }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ r.onPick }}\" class=\"blueprint\" style=\"{{ r.style }}\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading);font-size:17px;text-transform:uppercase;letter-spacing:.02em\">{{ r.label }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:3px;line-height:1.4\">{{ r.desc }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ pideClave }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"field\">\n            <label>{{ claveLabel }}<\u002Flabel>\n            <input class=\"input\" type=\"password\" inputmode=\"numeric\" placeholder=\"Clave\" value=\"{{ claveEscrita }}\" sc-camel-on-input=\"{{ setClave }}\" style=\"height:48px\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hayErrorIngreso }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;color:var(--color-accent-800);line-height:1.4\">{{ errorIngreso }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"button\" class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ entrar }}\" style=\"min-height:50px;justify-content:center\">Entrar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ HOY — vendedor ══ -->\n    <sc-if value=\"{{ esHoy }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap\">\n          <div>\n            <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ hoyTexto }}<\u002Fdiv>\n            <h3 style=\"text-transform:uppercase;letter-spacing:.02em;margin:4px 0 0\">Hola {{ miNombre }}<\u002Fh3>\n          <\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ nuevaVisita }}\" style=\"min-height:48px;padding:0 20px;white-space:nowrap;flex:0 0 auto\">＋ Cargar visita<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"cols3\">\n          <sc-for list=\"{{ hoyKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div class=\"blueprint\" style=\"padding:12px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading);font-size:24px;line-height:1\">{{ k.valor }}<\u002Fdiv>\n              <div style=\"font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700);margin-top:4px\">{{ k.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div class=\"cols\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n              <div style=\"font-family:var(--font-heading);font-size:16px;text-transform:uppercase;letter-spacing:.06em\">Cargadas hoy<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ hoyConteo }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ visitasHoy }}\" as=\"v\" hint-placeholder-count=\"2\">\n                <button type=\"button\" sc-camel-on-click=\"{{ v.onOpen }}\" class=\"blueprint\" style=\"width:100%;text-align:left;padding:11px 12px;background:none;cursor:pointer\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\">\n                    <div style=\"font-family:var(--font-heading);font-size:15.5px;text-transform:uppercase;line-height:1.15\">{{ v.cliente }}<\u002Fdiv>\n                    <span class=\"{{ v.estadoCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ v.estadoLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:3px\">{{ v.meta }}<\u002Fdiv>\n                  <div style=\"font-size:12px;margin-top:4px;line-height:1.35\">{{ v.resumen }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sinHoy }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"border:1px dashed var(--color-neutral-400);padding:24px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Todavía no cargaste nada hoy. Tocá “Cargar visita” al salir de cada cliente — se guarda igual sin señal.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n              <div style=\"font-family:var(--font-heading);font-size:16px;text-transform:uppercase;letter-spacing:.06em\">Para volver<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">próximos pasos<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ agenda }}\" as=\"a\" hint-placeholder-count=\"3\">\n                <div class=\"blueprint\" style=\"padding:10px 12px;{{ a.destacado }}\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\">\n                    <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase\">{{ a.cliente }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ a.cuando }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:2px\">{{ a.detalle }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sinAgenda }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"border:1px dashed var(--color-neutral-400);padding:24px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Sin compromisos anotados. Cuando cargues una visita, poné fecha de próximo contacto y aparece acá.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hayObservadas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"blueprint\" style=\"padding:12px 13px;background:var(--color-accent-100);border-color:var(--color-accent-400)\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-800)\">Te devolvieron trabajo<\u002Fdiv>\n            <div style=\"font-size:13px;margin-top:4px;line-height:1.4\">{{ textoObservadas }}<\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ irMisVisitas }}\" style=\"margin-top:9px;min-height:42px\">Ver observaciones<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ NUEVA VISITA ══ -->\n    <sc-if value=\"{{ esForm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:620px;display:flex;flex-direction:column;gap:13px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ cancelar }}\" class=\"btn btn-ghost\" style=\"align-self:flex-start;min-height:44px;padding-left:0;white-space:nowrap;flex:0 0 auto\">‹ Cancelar<\u002Fbutton>\n        <div>\n          <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ formKicker }}<\u002Fdiv>\n          <h4 style=\"text-transform:uppercase;margin:4px 0 0\">Registro de visita<\u002Fh4>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <div class=\"field\">\n            <label>Cliente<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Nombre del cliente\" value=\"{{ form.cliente }}\" sc-camel-on-input=\"{{ setCliente }}\" list=\"clientes-sug\" style=\"height:46px\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Localidad<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Localidad\" value=\"{{ form.localidad }}\" sc-camel-on-input=\"{{ setLocalidad }}\" style=\"height:46px\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <datalist id=\"clientes-sug\">\n          <sc-for list=\"{{ sugerencias }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <option value=\"{{ s }}\"><\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fdatalist>\n        <div class=\"cols\">\n          <div class=\"field\">\n            <label>Fecha<\u002Flabel>\n            <input class=\"input\" type=\"date\" value=\"{{ form.fecha }}\" sc-camel-on-change=\"{{ setF Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Tu nombre\" value=\"{{ form.vendedor }}\" sc-camel-on-input=\"{{ setVendedor }}\" style=\"height:46px\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Qué pasó<\u002Flabel>\n          <textarea class=\"input\" rows=\"4\" placeholder=\"Qué pidió, qué ofreciste, qué quedó pendiente\" value=\"{{ form.obs }}\" sc-camel-on-input=\"{{ setObs }}\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <div class=\"field\">\n            <label>Próximo contacto<\u002Flabel>\n            <input class=\"input\" type=\"date\" value=\"{{ form.proximo }}\" sc-camel-on-change=\"{{ setProximo }}\" style=\"height:46px\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Modo<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ form.proximoTipo }}\" sc-camel-on-change=\"{{ setProximoTipo }}\" style=\"height:46px\">\n              <option value=\"Visita\">Visita<\u002Foption>\n              <option value=\"Llamado\">Llamado<\u002Foption>\n              <option value=\"WhatsApp\">WhatsApp<\u002Foption>\n              <option value=\"\">Sin definir<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--color-neutral-700);line-height:1.4\">{{ textoGuardado }}<\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ guardar }}\" style=\"min-height:50px;justify-content:center\">Guardar visita<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ PLANIFICADOR DE SALIDAS — jefe / gerente ══ -->\n    <sc-if value=\"{{ esPlanificador }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap\">\n          <div ar(--color-neutral-400);padding:22px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Todavía no agregaste paradas. El motivo se sugiere solo con los datos del cliente y lo podés editar.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hayArmado }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:14px;border-top:1px solid var(--color-divider);padding-top:14px\">\n                <div class=\"cols\">\n                  <div class=\"field\">\n                    <label>Vendedor asignado<\u002Flabel>\n                    <input class=\"input\" type=\"text\" placeholder=\"Nombre del vendedor\" value=\"{{ salidaVendedor }}\" sc-camel-on-input=\"{{ setSalidaVendedor }}\" list=\"vendedores-sug\" style=\"height:46px\">\n                  <\u002Fdiv>\n                  <div class=\"field\">\n                    <label>Título de la salida<\u002Flabel>\n                    <input class=\"input\" type=\"text\" placeholder=\"Ej. Gira sur de Santa Fe\" value=\"{{ salidaTitulo }}\" sc-camel-on-input=\"{{ setSalidaTitulo }}\" style=\"height:46px\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <datalist id=\"vendedores-sug\">\n                  <sc-for list=\"{{ vendedoresConocidos }}\" as=\"v\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ v }}\"><\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fdatalist>\n                <div class=\"cols\">\n                  <div class=\"field\">\n                    <label>Desde<\u002Flabel>\n                    <input class=\"input\" type=\"date\" value=\"{{ salidaDesde }}\" sc-camel-on-change=\"{{ setSalidaDesde }}\" style=\"height:46px\">\n                  <\u002Fdiv>\n                  <div class=\"field\">\n                    <label>Hasta (vacío = un solo día)<\u002Flabel>\n                    <input class=\"input\" type yle=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">Asignado por jefatura<\u002Fdiv>\n          <h4 style=\"text-transform:uppercase;margin:4px 0 0\">Mis salidas<\u002Fh4>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ misSalidas }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <div class=\"blueprint\" style=\"padding:13px 14px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap\">\n                <div style=\"font-family:var(--font-heading);font-size:17px;text-transform:uppercase;line-height:1.15\">{{ s.titulo }}<\u002Fdiv>\n                <span class=\"{{ s.estadoCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ s.estadoLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:3px\">{{ s.meta }}<\u002Fdiv>\n              <div style=\"height:10px;display:flex;border:1px solid var(--color-divider);margin-top:9px\">\n                <div style=\"{{ s.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:5px\">{{ s.avance }}<\u002Fdiv>\n              <a class=\"btn btn-secondary\" href=\"{{ s.mapsUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:10px;min-height:44px;white-space:nowrap\">Abrir recorrido en Maps<\u002Fa>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n                <sc-for list=\"{{ s.paradas }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div class=\"blueprint\" style=\"padding:11px 12px;{{ p.destacado }}\">\n                    <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                    <div style=\"display:flex;gap:10px;align-items:flex-start\">\n                      <div style=\"flex:0 0 26px;font-family:var(--font-heading);font-size:17px;color:var(--color-accent-700)\">{{ p.num }}<\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;line-height:1.15\">{{ p.cliente }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:2px\">{{ p.localidad }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px;margin-top:5px;line-height:1.4\">{{ p.motivo }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px;color:var(--color-accent-800);margin-top:4px\">{{ p.nota }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span class=\"{{ p.estadoCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ p.estadoLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-top:10px\">\n                      <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ p.visitar }}\" style=\"flex:1;min-width:130px;justify-content:center;min-height:44px;white-space:nowrap\">Cargar visita<\u002Fbutton>\n                      <a class=\"btn btn-secondary\" href=\"{{ p.mapsUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"min-height:44px;white-space:nowrap\">Ir<\u002Fa>\n                      <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ p.reprogramar }}\" style=\"min-height:44px;white-space:nowrap\">Reprogramar<\u002Fbutton>\n                      <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ p.rechazar }}\" style=\"min-height:44px;white-space:nowrap\">No voy<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ s.agregarParada }}\" style=\"margin-top:12px;min-height:44px;white-space:nowrap\">＋ Agregar una parada mía<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ hayAjenas }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"blueprint\" style=\"padding:13px 14px;background:var(--color-accent-100);border-color:var(--color-accent-400)\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-800)\">Ojo con el nombre<\u002Fdiv>\n              <div style=\"font-size:13px;margin-top:5px;line-height:1.45\">{{ textoAjenas }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sinMisSalidas }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1px dashed var(--color-neutral-400);padding:26px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">No tenés salidas asignadas. Cuando jefatura apruebe una ruta, aparece acá con las paradas ordenadas y el motivo de cada visita.<\u002Fdiv>\n          <\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ refrescar }}\" style=\"align-self:flex-start;min-height:44px;white-space:nowrap\">Buscar salidas nuevas<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ CARTERA ══ -->\n    <sc-if value=\"{{ esCartera }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n          <h4 style=\"text-transform:uppercase;letter-spacing:.04em;margin:0\">Cartera<\u002Fh4>\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n            <div style=\"font-size:11.5px;color:var(--color-neutral-700)\">{{ carteraResumen }}<\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ nuevoCliente }}\" style=\"min-height:44px;white-space:nowrap;flex:0 0 auto;padding:0 16px\">＋ Cliente nuevo<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <input class=\"input\" type=\"search\" placeholder=\"Buscar cliente, localidad o código\" value=\"{{ busqueda }}\" sc-camel-on-input=\"{{ onBuscar }}\" style=\"width:100%;height:46px\">\n        <div style=\"display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px\">\n          <sc-for list=\"{{ carteraChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onPick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <sc-for list=\"{{ cartera }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onOpen }}\" class=\"blueprint\" style=\"width:100%;text-align:left;display:flex;gap:11px;padding:12px 13px;background:none;cursor:pointer;align-items:flex-start\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-family:var(--font-heading);font-size:15.5px;text-transform:uppercase;line-height:1.15\">{{ c.nombre }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:3px\">{{ c.meta }}<\u002Fdiv>\n                <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-top:6px\">\n                  <sc-for list=\"{{ c.tags }}\" as=\"t\" hint-placeholder-count=\"2\">\n                    <span class=\"{{ t.cls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ t.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;flex:0 0 auto\">\n                <div style=\"font-family:var(--font-heading);font-size:15px;line-height:1.1\">{{ c.pot }}<\u002Fdiv>\n                <div style=\"font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600)\">{{ c.potLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ carteraVacia }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px dashed var(--color-neutral-400);padding:24px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">{{ carteraVaciaTexto }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ FICHA DE CLIENTE ══ -->\n    <sc-if value=\"{{ esFicha }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ volverCartera }}\" class=\"btn btn-ghost\" style=\"align-self:flex-start;min-height:44px;padding-left:0;white-space:nowrap;flex:0 0 auto\">‹ Volver a la cartera<\u002Fbutton>\n        <div style=\"display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end\">\n          <div>\n            <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ ficha.codigo }}<\u002Fdiv>\n            <h4 style=\"text-transform:uppercase;margin:4px 0 0;line-height:1.1\">{{ ficha.nombre }}<\u002Fh4>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:4px\">{{ ficha.loc }}<\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:9px\">\n              <sc-for list=\"{{ ficha.tags }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <span class=\"{{ t.cls }}\" style=\"font-size:10.5px;letter-spacing:.05em;white-space:nowrap\">{{ t.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ visitarFicha }}\" style=\"min-height:48px;white-space:nowrap;padding:0 18px\">＋ Cargar visita<\u002Fbutton>\n            <a class=\"btn btn-secondary\" href=\"{{ ficha.mapsUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"min-height:48px\">Mapa<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cols3\">\n          <sc-for list=\"{{ ficha.kpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n            <div class=\"blueprint\" style=\"padding:11px 12px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:20px;line-height:1.05;margin-top:4px\">{{ k.valor }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ ficha.hayAccion }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"blueprint\" style=\"padding:12px 13px;background:var(--color-accent-100);border-color:var(--color-accent-400)\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-800)\">Acción recomendada<\u002Fdiv>\n            <div style=\"font-size:13px;margin-top:4px;line-height:1.4\">{{ ficha.accion }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"cols\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n              <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Facturación por año<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ ficha.histTotal }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ ficha.hist }}\" as=\"y\" hint-placeholder-count=\"7\">\n                <div style=\"display:flex;align-items:center;gap:9px\">\n                  <div style=\"flex:0 0 34px;font-size:11px;color:var(--color-neutral-700)\">{{ y.anio }}<\u002Fdiv>\n                  <div style=\"flex:1;height:12px;display:flex;border:1px solid var(--color-divider)\">\n                    <div style=\"{{ y.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 0 66px;text-align:right;font-size:11px\">{{ y.monto }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n              <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Visitas registradas<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ ficha.visitasResumen }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ ficha.visitas }}\" as=\"v\" hint-placeholder-count=\"2\">\n                <div class=\"blueprint\" style=\"padding:10px 12px\">\n                  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\">\n                    <div style=\"font-family:var(--font-heading);font-size:14px;text-transform:uppercase\">{{ v.fecha }}<\u002Fdiv>\n                    <span class=\"{{ v.estadoCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ v.estadoLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:3px\">{{ v.meta }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;margin-top:4px;line-height:1.4\">{{ v.resumen }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ ficha.sinVisitas }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px dashed var(--color-neutral-400);padding:20px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Sin visitas cargadas para este cliente.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px\">\n            <div style=\"font-family:var(--font-heading);font-size:15px;text-transform:uppercase;letter-spacing:.06em\">Parque<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\">\n              <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ ficha.parqueResumen }}<\u002Fdiv>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ agregarMaquina }}\" style=\"min-height:40px;white-space:nowrap;flex:0 0 auto\">＋ Máquina<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cols\">\n            <sc-for list=\"{{ ficha.parque }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div class=\"blueprint\" style=\"padding:10px 12px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\">\n                  <div style=\"font-family:var(--font-heading);font-size:14.5px;text-transform:uppercase\">{{ m.modelo }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ m.anio }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:2px\">{{ m.desc }}<\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px\">\n                  <span class=\"{{ m.garCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ m.gar }}<\u002Fspan>\n                  <span style=\"color:var(--color-neutral-700)\">{{ m.pot }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ ficha.sinParque }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px dashed var(--color-neutral-400);padding:20px;text-align:center;font-size:12.5px;color:var(--color-neutral-700)\">Sin parque registrado. Verificá el equipo real en la visita.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ ALTA (cliente nuevo o máquina) ══ -->\n    <sc-if value=\"{{ esAlta }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:620px;display:flex;flex-direction:column;gap:13px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ cancelarAlta }}\" class=\"btn btn-ghost\" style=\"align-self:flex-start;min-height:44px;padding-left:0;white-space:nowrap;flex:0 0 auto\">‹ Cancelar<\u002Fbutton>\n        <div>\n          <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ alta.kicker }}<\u002Fdiv>\n          <h4 style=\"text-transform:uppercase;margin:4px 0 0\">{{ alta.titulo }}<\u002Fh4>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-top:6px;line-height:1.45\">{{ alta.ayuda }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ alta.esCliente }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div class=\"field\">\n              <label>Razón social o nombre *<\u002Flabel>\n              <input class=\"input\" type=\"text\" placeholder=\"Como factura\" value=\"{{ alta.n }}\" sc-camel-on-input=\"{{ setAltaN }}\" style=\"height:46px\">\n            <\u002Fdiv>\n            <div class=\"cols\">\n              <div class=\"field\">\n                <label>CUIT<\u002Flabel>\n                <input class=\"input\" type=\"text\" inputmode=\"numeric\" placeholder=\"30-00000000-0\" value=\"{{ alta.cuit }}\" sc-camel-on-input=\"{{ setAltaCuit }}\" style=\"height:46px\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Teléfono<\u002Flabel>\n                <input class=\"input\" type=\"tel\" inputmode=\"tel\" placeholder=\"Con característica\" value=\"{{ alta.tel }}\" sc-camel-on-input=\"{{ setAltaTel }}\" style=\"height:46px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"cols\">\n              <div class=\"field\">\n                <label>Localidad *<\u002Flabel>\n                <input class=\"input\" type=\"text\" placeholder=\"Localidad\" value=\"{{ alta.l }}\" sc-camel-on-input=\"{{ setAltaL }}\" style=\"height:46px\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Provincia *<\u002Flabel>\n                <input class=\"input\" type=\"text\" placeholder=\"Provincia\" value=\"{{ alta.p }}\" sc-camel-on-input=\"{{ setAltaP }}\" style=\"height:46px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Contacto<\u002Flabel>\n              <input class=\"input\" type=\"text\" placeholder=\"Nombre y cargo de quien decide\" value=\"{{ alta.contacto }}\" sc-camel-on-input=\"{{ setAltaContacto }}\" style=\"height:46px\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Actividad y comentarios<\u002Flabel>\n              <textarea class=\"input\" rows=\"3\" placeholder=\"Qué hace, cuántas hectáreas, con qué marca trabaja hoy\" value=\"{{ alta.obs }}\" sc-camel-on-input=\"{{ setAltaObs }}\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ tomarUbicacion }}\" style=\"min-height:44px;white-space:nowrap\">Tomar ubicación acá<\u002Fbutton>\n              <div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ alta.ubicacionTexto }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ alta.esMaquina }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div class=\"cols\">\n              <div class=\"field\">\n                <label>Modelo *<\u002Flabel>\n                <input class=\"input\" type=\"text\" placeholder=\"Ej. T7.240\" value=\"{{ alta.md }}\" sc-camel-on-input=\"{{ setAltaMd }}\" style=\"height:46px\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Año<\u002Flabel>\n                <input class=\"input\" type=\"number\" inputmode=\"numeric\" placeholder=\"2018\" value=\"{{ alta.an }}\" sc-camel-on-input=\"{{ setAltaAn }}\" style=\"height:46px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"cols\">\n              <div class=\"field\">\n                <label>Número de serie / chasis<\u002Flabel>\n                <input class=\"input\" type=\"text\" placeholder=\"Si lo podés ver en la máquina\" value=\"{{ alta.ns }}\" sc-camel-on-input=\"{{ setAltaNs }}\" style=\"height:46px\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Horas / uso<\u002Flabel>\n                <input class=\"input\" type=\"text\" placeholder=\"Ej. 4300 hs\" value=\"{{ alta.hs }}\" sc-camel-on-input=\"{{ setAltaHs }}\" style=\"height:46px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Tipo de equipo<\u002Flabel>\n              <input class=\"input\" type=\"text\" placeholder=\"Tractor, cosechadora, pulverizadora…\" value=\"{{ alta.ds }}\" sc-camel-on-input=\"{{ setAltaDs }}\" style=\"height:46px\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Garantía<\u002Flabel>\n              <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                <sc-for list=\"{{ alta.opcionesGarantia }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.onPick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Observaciones<\u002Flabel>\n              <textarea class=\"input\" rows=\"3\" placeholder=\"Estado, si compró en otro concesionario, qué necesita\" value=\"{{ alta.obs }}\" sc-camel-on-input=\"{{ setAltaObs }}\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"font-size:11.5px;color:var(--color-neutral-700);line-height:1.4\">Se envía a revisión del jefe de repuestos. Cuando la apruebe, queda cargado en la base que ven todos.<\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ enviarAlta }}\" style=\"min-height:50px;justify-content:center\">Enviar a revisión<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══ MIS VISITAS ══ -->\n    <sc-if value=\"{{ esMisVisitas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n          <h4 style=\"text-transform:uppercase;letter-spacing:.04em;margin:0\">Mis visitas<\u002Fh4>\n          <div style=\"font-size:11.5px;color:var(--color-neutral-700)\">{{ misResumen }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px\">\n          <sc-for list=\"{{ misChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onPick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <sc-for list=\"{{ misVisitas }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <div class=\"blueprint\" style=\"padding:12px 13px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\">\n                <div style=\"font-family:var(--font-heading);font-size:15.5px;text-transform:uppercase;line-height:1.15\">{{ v.cliente }}<\u002Fdiv>\n                <span class=\"{{ v.estadoCls }}\" style=\"font-size:10px;letter-spacing:.05em;white-space:nowrap\">{{ v.estadoLabel }}
